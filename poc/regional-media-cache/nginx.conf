load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
# Executable synthetic-origin PoC, NOT a production install template.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
    map_hash_bucket_size 128;
    js_import gate from /etc/nginx/gate.mjs;
    resolver 127.0.0.11 ipv6=off valid=10s;
    include /etc/nginx/fetch-budget.conf;
    js_fetch_max_response_buffer_size 1m;
    js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    js_fetch_verify on;
    access_log off;
    server_tokens off;
    proxy_temp_path /tmp/proxy;
    client_body_temp_path /tmp/client;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_cache_path /cache levels=1:2 keys_zone=photos:1m max_size=32m inactive=1m use_temp_path=off;
    # Exact RAW request target. No percent encoding, query or normalization aliases.
    map $request_uri $allowed {
        default 0;
        include /etc/nginx/allowed.map;
    }
    map $upstream_http_content_type $bad_type { default 1; "image/webp" 0; }
    map $status $success { default 0; 200 1; 304 1; }
    map "$success:$upstream_http_cache_control:$bad_type" $browser_cache {
        default "no-store";
        "1::0" "public, max-age=0, must-revalidate";
    }
    limit_conn_zone $server_name zone=connections:1m;
    limit_req_zone $server_name zone=requests:1m rate=20r/s;
    upstream public_origin { server 127.0.0.1:8081; }
    server {
        listen 127.0.0.1:8081;
        location / { js_content gate.serve; }
    }
    server {
        listen 8080 default_server;
        server_name media.localhost;
        if ($host != media.localhost) { return 421; }
        if ($allowed = 0) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_authorization != "") { return 403; }
        if ($http_cookie != "") { return 403; }
        location / {
            limit_conn connections 16;
            limit_req zone=requests burst=32 nodelay;
            limit_req_status 429;
            client_max_body_size 1k;
            client_body_timeout 2s;
            send_timeout 3s;
            keepalive_timeout 5s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 9s;
            proxy_send_timeout 1s;
            proxy_next_upstream off;
            proxy_pass http://public_origin;
            # No browser-supplied headers reach S3. Upstream authority is static.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host origin.public.invalid;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_cache photos;
            proxy_cache_key "public-v1:$uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_lock_age 10s;
            proxy_cache_revalidate on;
            proxy_cache_valid 200 2s;
            proxy_cache_use_stale off;
            proxy_cache_background_update off;
            proxy_no_cache $bad_type;
            # Honor upstream no-store/private/Set-Cookie; never ignore those fields.
            proxy_ignore_headers X-Accel-Redirect;
            proxy_hide_header X-Accel-Redirect;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Vary;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;
            proxy_max_temp_file_size 1m;
            proxy_limit_rate 1m;
            limit_rate 1m;
            # njs admission enforces size/MIME/hash before a 200 can reach this cache.
            add_header Cache-Control $browser_cache always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}

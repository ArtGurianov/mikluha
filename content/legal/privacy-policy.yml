title: Политика обработки персональных данных
slug: privacy-policy
updatedAt: "2026-10-06"
content: |-
  Оператор персональных данных: Общество с ограниченной ответственностью «ООО МИКЛУХА МАКЛАЙ», ИНН 4205435867, ОГРН 1264200007631, адрес: 650065, Кемеровская область — Кузбасс, г. Кемерово, проспект Московский, д. 31, кв. 145. Контакт по вопросам персональных данных: artur@mikluha-maklai.ru.

  ## 1. Где обрабатываются данные

  Публичный сайт https://mikluha-maklai.ru является статическим: на нем нет форм, аккаунтов, аналитики или cookies. Кнопка бронирования переводит на отдельный сервис https://book.mikluha-maklai.ru, где оформляются заказ, договор и оплата.

  Первичный сбор и хранение персональных данных, рабочая база и резервные копии находятся в Российской Федерации в инфраструктуре cloud.ru. Персональные данные не передаются иностранным сервисам, системам аналитики или CI.

  ## 2. Субъекты и состав данных

  Заказчик в онлайн-бронировании всегда является туристом № 1. Заказчик, который сам не едет, онлайн не оформляется.

  - для Заказчика (туриста № 1): ФИО, дата рождения, гражданство, вид, серия и номер документа, телефон и email;
  - для каждого другого туриста: ФИО, дата рождения, гражданство, вид, серия и номер документа;
  - сведения заказа и туристского продукта: номер, даты, маршрут, цена, размещение, перевозка и другие услуги и поставщики;
  - сведения платежа и кассового чека без полного номера банковской карты, CVC/CVV и банковских кодов подтверждения;
  - технический секрет необходимой cookie, IP-адрес и минимальные технические данные, необходимые для безопасности и ограничения злоупотреблений сервисом бронирования.

  Не собираются дата выдачи документа, выдавший орган, код подразделения, адрес регистрации, сканы документов, пол, специальные категории или биометрические данные. В онлайн-бронировании участвуют только совершеннолетние туристы.

  Паспортные и иные идентификационные данные туристов не принимаются и не хранятся в Telegram, WhatsApp или Google Sheets. Для передачи необходимого списка конкретному исполнителю используется согласованный защищённый канал с ограниченным доступом; ссылки доступа к договору не публикуются и не пересылаются в общие чаты.

  ## 3. Цели и основания

  Данные обрабатываются для заключения и исполнения договора о реализации туристского продукта, бронирования входящих услуг, расчетов и чеков, передачи обязательных сведений в ЕИС «Электронная путёвка», связи по заказу, возвратов, претензий, защиты заказа и выполнения обязанностей по закону.

  Основания: договор с субъектом или в его пользу, обязанности Туроператора по закону и отдельное согласие на обработку персональных данных для операций, где оно требуется. Согласие подтверждается отдельно от принятия Публичной оферты. Рекламного согласия в форме бронирования нет.

  ## 4. Получатели и обработчики

  Данные передаются только в необходимом объеме:

  - поставщикам размещения, перевозки, экскурсий и иных услуг, которые названы в Заявке на бронирование конкретного заказа;
  - ЕИС «Электронная путёвка» — в объеме обязательных сведений;
  - АО «Альфа-Банк» — для эквайринга; кассовые чеки формируются через банк и оператора фискальных данных;
  - ИП Гурьянов Арт Артурович, ИНН 420539506224 (сервис Refref) — по поручению Туроператора для обработки email кассового чека, идентификаторов бизнеса, заказа и платежа, данных атрибуции и технической информации, необходимой для платежного взаимодействия и сверки;
  - сервису транзакционной электронной почты UniSender Go — по поручению Туроператора для отправки подтверждения заказа и доступа к замороженным договорным документам. Передаются email получателя, номер заказа, защищенная ссылка доступа, устойчивый технический идентификатор отправки и сведения о доставке.

  ФИО туристов, даты рождения, гражданство и реквизиты документов в Refref и UniSender Go не передаются. Письмо о заказе является договорным, а не рекламным; рекламное согласие и маркетинговая рассылка в него не включаются.

  До первой реальной продажи между Туроператором и ИП Гурьяновым А.А. должно быть подписано отдельное поручение на обработку персональных данных, а с UniSender Go — оформлены применимые условия обработки. Для обоих обработчиков до запуска подтверждаются хранение и обработка передаваемых персональных данных в Российской Федерации.

  ## 5. Сроки хранения

  - заказ, который не был оплачен: контакт, сведения туристов, Заявка и другие персональные данные удаляются не позднее 24 часов после окончания или отмены брони;
  - оплаченный заказ: контакт и строки туристов удаляются через 90 дней после окончания поездки;
  - оплаченная Заявка является договором и хранится 3 года с окончания договора: для исполненного заказа — с окончания поездки, для возвращенного — с даты возврата; для статуса `PAID`, пока договор не завершен, трехлетний срок не начинается;
  - установленный правовой запрет на удаление (`legal hold`) приостанавливает любое удаление до снятия такого запрета.

  Неперсональные контрольные суммы, технические идентификаторы и обязательные платежные, фискальные, бухгалтерские или налоговые сведения могут храниться отдельно в сроки, установленные законом.

  ## 6. Безопасность и права субъекта

  Оператор разграничивает доступ, ведет учет действий, шифрует резервные копии, не записывает персональные данные в логи и применяет иные меры соразмерно рискам.

  Субъект вправе получать сведения об обработке, требовать уточнения, блокирования или уничтожения данных при наличии законных оснований, отозвать согласие, а также обжаловать действия Оператора в Роскомнадзор или суд. Отзыв согласия не прекращает обработку, которую Оператор вправе или обязан продолжить по договору или закону.

  Обращения направляются на artur@mikluha-maklai.ru или по адресу Оператора. Актуальная редакция Политики публикуется на https://mikluha-maklai.ru/privacy-policy.

title: Политика конфиденциальности
slug: privacy-policy
updatedAt: "2026-08-20"
content: |-
  Сайт «Миклуха Маклай» устроен так, чтобы не собирать и не обрабатывать персональные данные
  посетителей.

  ## Чего на сайте нет

  - форм обратной связи или заявок с полями имени, телефона, email;
  - регистрации и личных кабинетов;
  - систем аналитики и трекинга (Google Analytics, Яндекс Метрика и аналогов);
  - cookies для аналитики или маркетинга;
  - сведений о банковских переводах — сайт не получает и не хранит информацию о том, кто и
    сколько оплатил по QR-коду;
  - собственной базы данных клиентов (CRM).

  ## Что происходит на сайте

  Сайт только отображает заранее опубликованный контент: программы туров, даты выездов и отзывы.
  Кнопка «Забронировать место» открывает информационное окно с суммой бронирования,
  QR-кодом и телефоном организатора — никакие данные при этом на сервер не передаются.

  Если у вас остались вопросы о работе сайта, свяжитесь с организатором по телефону, указанному в
  подвале сайта.

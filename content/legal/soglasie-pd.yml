title: Согласие на обработку персональных данных
slug: soglasie-pd
updatedAt: "2026-10-04"
content: |-
  Настоящее согласие подтверждается отдельным обязательным флажком в форме бронирования и не объединяется с принятием Публичной оферты. Система сохраняет редакцию документа, ее контрольную сумму, номер заказа и дату и время подтверждения.

  Заказчик — турист № 1 — свободно, конкретно, предметно, информированно, сознательно и однозначно предоставляет Обществу с ограниченной ответственностью «ООО МИКЛУХА МАКЛАЙ» (ИНН 4205435867, адрес: 650065, Кемеровская область — Кузбасс, г. Кемерово, проспект Московский, д. 31, кв. 145) согласие на обработку данных в указанном ниже объеме в случаях, когда соответствующая операция требует согласия.

  ## Данные

  - о Заказчике (туристе № 1): ФИО, дата рождения, гражданство, вид, серия и номер документа, телефон и email;
  - о других туристах заказа: ФИО, дата рождения, гражданство, вид, серия и номер документа;
  - сведения об оформленном заказе, поездке и входящих в туристский продукт услугах.

  Полные реквизиты банковской карты Туроператор не получает и не хранит.

  ## Цели и действия

  Цели: заключение и исполнение договора о реализации туристского продукта; бронирование размещения, перевозки и иных услуг; передача обязательных сведений в ЕИС «Электронная путёвка»; взаимодействие по заказу; обработка обращений и возвратов.

  Действия: сбор, запись, систематизация, накопление, хранение, уточнение, извлечение, использование, необходимая передача, блокирование, удаление и уничтожение с использованием средств автоматизации и без них.

  Получатели в необходимом объеме: поставщики, названные в Заявке на бронирование; ЕИС «Электронная путёвка»; АО «Альфа-Банк» и оператор фискальных данных для оплаты и чеков; ИП Гурьянов Арт Артурович (ИНН 420539506224, сервис Refref) — только для обработки email чека, идентификаторов заказа и платежа, атрибуции и технических данных платежного взаимодействия. ФИО, даты рождения, гражданство и документы туристов в Refref не передаются.

  ## Срок и отзыв

  Согласие действует до достижения целей обработки или отзыва, если дальнейшая обработка не требуется по договору или закону. Сроки фактического хранения описаны в Политике обработки персональных данных. Отзыв направляется на artur@mikluha-maklai.ru.

  Отзыв не прекращает обработку, которую Оператор вправе или обязан продолжить на другом законном основании. Согласие на рекламу в этот документ не входит и условием покупки не является.

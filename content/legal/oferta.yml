  Редакция от 04.10.2026. Туроператор: ООО «ООО МИКЛУХА МАКЛАЙ», реестровый номер В031-00161-00/06887919.

  Настоящая оферта адресована неопределённому кругу лиц и предназначена для прямой онлайн-продажи туристских продуктов Туроператора по России. Индивидуальные параметры конкретной поездки фиксируются в Заявке на бронирование.

  ## 1. Термины и структура договора

  1.1. Туроператор — ООО «ООО МИКЛУХА МАКЛАЙ», формирующее и реализующее туристский продукт в сфере внутреннего туризма.

  1.2. Заказчик — совершеннолетнее физическое лицо, заключающее договор в своих интересах и (или) в интересах указанных им туристов. Турист — лицо, непосредственно совершающее путешествие. При онлайн-бронировании на сайте Заказчик сам является одним из туристов (турист № 1 в Заявке), а все туристы должны быть совершеннолетними; поездку, в которой Заказчик не участвует или участвуют несовершеннолетние, можно оформить, связавшись с Туроператором.

  1.3. Туристский продукт — комплекс услуг, сформированный Туроператором и указанный в Заявке на бронирование, включающий размещение на территории Российской Федерации и одну или несколько дополнительных услуг, в том числе перевозку.

  1.4. Неотъемлемыми частями договора являются настоящая Оферта, Заявка на бронирование, Программа тура и иные документы, прямо названные в Заявке. При расхождении индивидуальные условия Заявки имеют приоритет в части конкретных параметров поездки, если они не ухудшают права потребителя по сравнению с законом.

  ## 2. Сведения о Туроператоре и финансовом обеспечении

  2.1. Туроператор: Общество с ограниченной ответственностью «ООО МИКЛУХА МАКЛАЙ»; ОГРН 1264200007631; ИНН 4205435867; адрес: 650065, Кемеровская область — Кузбасс, г. Кемерово, проспект Московский, д. 31, кв. 145; e-mail: artur@mikluha-maklai.ru; телефон: +7 (903) 907-55-47; сайт: https://mikluha-maklai.ru; реестровый номер: В031-00161-00/06887919; сфера деятельности: внутренний туризм.

  2.2. Ответственность Туроператора обеспечена договором страхования № 00830-420001-26 от 03.09.2026, действующим с 11.09.2026 по 10.09.2027, страховая сумма — 500 000 (Пятьсот тысяч) рублей. Страховщик: АО «Боровицкое страховое общество», адрес: 119049, г. Москва, вн. тер. г. муниципальный округ Якиманка, ул. Мытная, д. 1, стр. 1, ОГРН 1027700533145, ИНН 7714034590, тел. +7 (495) 118-25-55, e-mail info@bsoinsur.ru, сайт https://bsoinsur.ru/.

  ## 3. Предмет договора

  3.1. Туроператор обязуется обеспечить оказание туристу комплекса услуг, входящих в выбранный туристский продукт, а Заказчик обязуется оплатить его на условиях договора.

  3.2. Туроператор вправе привлекать третьих лиц для исполнения отдельных услуг, оставаясь ответственным перед туристом и Заказчиком в объеме, установленном законодательством Российской Федерации.

  3.3. Конкретные поставщики услуг (перевозчик, средство размещения, экскурсионные и иные исполнители), известные к моменту продажи, указываются в Заявке на бронирование и (или) Программе тура. При законной замене поставщика Туроператор уведомляет Заказчика и обеспечивает услугу, соответствующую согласованным характеристикам, если иное не согласовано сторонами.

  ## 4. Заключение электронного договора

  4.1. Заказчик заполняет на сайте сведения о себе и туристах. Места резервируются за Заказчиком на 30 минут. До оплаты Заказчику показываются сформированная для его заказа Заявка на бронирование (включая Программу тура) и итоговая цена, а также доступны настоящая Оферта, сведения о Туроператоре, Правила оплаты и Правила отказа и возврата.

  4.2. Электронный договор считается заключенным с момента успешной оплаты туристского продукта, подтверждающей согласие Заказчика с предложенными условиями. Система Туроператора сохраняет версию Оферты и индивидуальных условий, действовавших для конкретного заказа.

  4.3. Договор заключается в письменной форме электронного документа. Туроператор направляет Заказчику подтверждение заказа и доступ к сохраненной версии договорных документов по указанному Заказчиком электронному адресу и (или) в интерфейсе сайта.

  ## 5. Заявка на бронирование и существенные условия

  5.1. В Заявке фиксируются сведения о Заказчике и туристах, даты и продолжительность поездки, маршрут и программа, средство размещения и условия проживания, питание, перевозка, экскурсии и дополнительные услуги, конкретные третьи лица, оказывающие услуги, общая цена в рублях и иные существенные параметры.

  5.2. Заказчик обязан проверить данные Заявки до оплаты, в том числе ФИО, даты рождения, гражданство и реквизиты документов туристов. Обнаруженная после оплаты ошибка исправляется по обращению Заказчика, если это технически и юридически возможно; расходы поставщиков, вызванные заменой данных, могут учитываться только в фактически понесенном и подтвержденном размере.

  ## 6. Цена и оплата

  6.1. Общая цена туристского продукта указывается в рублях в Заявке на бронирование и включает только услуги, прямо перечисленные как включенные в цену.

  6.2. Если в Заявке не указано иное, применяется 100% предварительная оплата в момент оформления заказа. Оплата производится на платёжной странице банка-эквайера АО «Альфа-Банк» способами, доступными на этой странице. Данные банковской карты вводятся на стороне банка и Туроператору не передаются.

  6.3. Туроператор не вправе без отдельного волеизъявления Заказчика включать в заказ платные дополнительные услуги. Услуги, обозначенные как не включенные в цену, приобретаются отдельно.

  6.4. Кассовый чек на 100% предварительную оплату формируется банком-эквайером через оператора фискальных данных и направляется на адрес электронной почты Заказчика, указанный при бронировании. Чек при возврате формируется тем же способом.

  ## 7. Права и обязанности Туроператора

  - обеспечить оказание всех услуг, входящих в туристский продукт, в соответствии с договором и обязательными требованиями;
  - предоставить до заключения договора необходимую и достоверную информацию о маршруте, размещении, питании, перевозке, дополнительных услугах, цене, поставщиках и существенных рисках конкретной поездки;
  - передать предусмотренные законом сведения в ЕИС «Электронная путёвка» в установленный срок;
  - не позднее чем за 24 часа до начала путешествия передать Заказчику документы, удостоверяющие право туриста на услуги, входящие в туристский продукт, когда договор заключен ранее этого срока; при покупке позднее — передать их в максимально возможный срок либо в срок, согласованный с потребителем. К таким документам относятся электронный перевозочный документ (билет) либо иной документ, подтверждающий право на перевозку, если перевозка входит в туристский продукт, и документ о бронировании и получении места в средстве размещения (ваучер);
  - обеспечивать безопасность и качество туристского продукта в пределах обязанностей Туроператора и принимать разумные меры при изменении дорожной, погодной и иной обстановки;
  - уведомлять Заказчика о существенных изменениях условий путешествия и действовать в соответствии с законом и договором.
  ## 8. Права и обязанности Заказчика и туристов

  - предоставлять достоверные сведения, необходимые для бронирования, размещения, перевозки, формирования электронной путевки и исполнения иных законных обязанностей Туроператора;
  - самостоятельно проверить корректность ФИО, дат рождения, гражданства и реквизитов документов, удостоверяющих личность, в Заявке до оплаты и незамедлительно сообщать об ошибках;
  - иметь при себе документы, необходимые для поездки и заселения; соблюдать правила перевозчика, средства размещения, объектов посещения, требования безопасности и законные указания сопровождающих/представителей исполнителей;
  - прибыть в место посадки ко времени, указанному Туроператором. Рекомендуемое время прибытия — не позднее чем за 20 минут до отправления, если в Программе не установлен иной срок;
  - сообщить Туроператору контактный номер и обеспечить разумную доступность по нему в период поездки;
  - нести ответственность за сохранность личных вещей, если иное не предусмотрено законом или договором хранения/перевозки.
  ## 9. Размещение, автобусная перевозка и программа

  9.1. Средство размещения, адрес, категория (при наличии), тип номера, даты проживания и питание указываются в Заявке/Программе. При необходимости указывается номер записи средства размещения в соответствующем государственном реестре.

  9.2. Для заказной автобусной перевозки Туроператор заключает договор с перевозчиком/фрахтовщиком. Порядок посадки, маршрут, ориентировочные остановки и иные значимые условия отражаются в Программе тура и Памятке туриста.

  9.3. Время прохождения отдельных точек маршрута может корректироваться в разумных пределах из-за дорожной ситуации, погоды, требований безопасности, режима работы объектов и иных объективных обстоятельств. Такие корректировки не дают Туроператору права произвольно ухудшать существенные условия путешествия.

  ## 10. Информация о рисках и добровольном страховании

  10.1. Характерные риски конкретного маршрута указываются в Программе тура и Памятке. Для поездок в горную местность это могут быть резкие изменения погоды и температуры, гололед, камнепады, сложный рельеф, длительные переезды, ограниченная связь и удаленность медицинской инфраструктуры.

  10.2. Если в Заявке прямо не указано иное, договор добровольного страхования туриста (медицинские расходы, несчастный случай, отмена поездки и иные риски) в цену туристского продукта не включен. Турист вправе приобрести такое страхование самостоятельно.

  ## 11. Изменение и расторжение договора

  11.1. Договор может быть изменен или расторгнут по соглашению сторон и в иных случаях, предусмотренных законодательством Российской Федерации.

  11.2. Заказчик вправе отказаться от договора в любое время. При добровольном отказе Туроператор возвращает уплаченную сумму за вычетом фактически понесенных и документально подтверждаемых расходов, непосредственно связанных с исполнением конкретного заказа. Фиксированные штрафы за отказ не применяются вместо расчета фактических расходов.

  11.3. Если в месте временного пребывания официально возникла угроза безопасности жизни/здоровью туристов либо опасность причинения вреда их имуществу, применяются специальные последствия расторжения, предусмотренные законодательством: в частности, при расторжении до начала путешествия возвращается общая цена туристского продукта.

  11.4. Существенное изменение обстоятельств (в том числе ухудшение согласованных условий, изменение сроков, непредвиденный рост транспортных тарифов, невозможность поездки по независящим от потребителя обстоятельствам и иные предусмотренные законом случаи) является основанием для изменения/расторжения в порядке, установленном законодательством.

  ## 12. Возвраты и фактически понесенные расходы

  12.1. При отказе Заказчика Туроператор определяет фактические расходы на основании документов и расчетов поставщиков: невозвратные платежи/удержания средства размещения, перевозчика, экскурсионных и иных исполнителей, если они относятся именно к конкретному заказу и не были возвращены Туроператору.

  12.2. Туроператор по запросу предоставляет расчет удержанной суммы и подтверждает относимость расходов к заказу. Оценочные или предполагаемые расходы до их фактического возникновения не удерживаются как окончательные.

  12.3. Возврат производится способом, допускаемым законом и платежной инфраструктурой, как правило на тот же платежный инструмент, которым была произведена оплата.

  ## 13. Персональные данные

  13.1. Обработка персональных данных осуществляется в соответствии с законодательством Российской Федерации и Политикой обработки персональных данных Туроператора.

  13.2. Данные, объективно необходимые для заключения и исполнения договора (для Заказчика — ФИО, телефон, адрес электронной почты; для каждого туриста — ФИО, дата рождения, гражданство и реквизиты документа, удостоверяющего личность), выполнения обязанностей Туроператора перед ЕИС «Электронная путёвка» и соблюдения закона, обрабатываются на соответствующих законных основаниях (пункты 2, 5 части 1 статьи 6 Федерального закона № 152-ФЗ). Если для отдельной операции требуется согласие, оно оформляется отдельно от Оферты и иных подтверждаемых документов.

  13.3. Согласие на рекламные сообщения не является условием покупки и оформляется отдельно.

  ## 14. ЕИС «Электронная путёвка»

  14.1. Туроператор передает в ЕИС сведения, предусмотренные законодательством, в том числе сведения из договора, о туристах и составе туристского продукта.

  14.2. Заказчик и турист вправе получать сведения из ЕИС в порядке, предусмотренном правилами функционирования системы.

  ## 15. Ответственность сторон и обстоятельства вне контроля

  15.1. Стороны несут ответственность в соответствии с законодательством Российской Федерации. Никакое положение Оферты не ограничивает права потребителя и ответственность Туроператора в случаях, когда такое ограничение запрещено законом.

  15.2. Туроператор не отвечает за услуги, которые не входят в туристский продукт и приобретаются туристом самостоятельно у третьих лиц, если иное не следует из закона.

  15.3. При обстоятельствах непреодолимой силы, официальных ограничениях, опасных природных явлениях, перекрытии дорог и иных объективных обстоятельствах стороны действуют с учетом закона, характера обстоятельств и обязанности минимизировать негативные последствия. Само по себе упоминание таких обстоятельств не лишает потребителя предусмотренных законом прав на возврат, изменение или расторжение договора.

  ## 16. Претензии и споры

  16.1. Обращения и претензии направляются Туроператору по адресу 650065, Кемеровская область — Кузбасс, г. Кемерово, проспект Московский, д. 31, кв. 145 или на e-mail artur@mikluha-maklai.ru.

  16.2. Претензии к качеству туристского продукта предъявляются в письменной форме в течение 20 календарных дней со дня окончания действия договора и рассматриваются Туроператором в течение 10 календарных дней со дня получения. Для иных требований применяются сроки, установленные законодательством.

  16.3. Споры, не урегулированные добровольно, разрешаются в соответствии с законодательством Российской Федерации о защите прав потребителей и правилами подсудности.

  ## 17. Финансовое обеспечение: порядок требования

  17.1. При наличии установленного законом основания Заказчик/турист вправе предъявить требование о страховом возмещении непосредственно АО «Боровицкое страховое общество» по адресу 119049, г. Москва, вн. тер. г. муниципальный округ Якиманка, ул. Мытная, д. 1, стр. 1, e-mail info@bsoinsur.ru, тел. +7 (495) 118-25-55.

  17.2. Требование и приложения к нему оформляются по статье 17.5 Федерального закона № 132-ФЗ. Страховое возмещение по данному обеспечению относится к случаям, предусмотренным законом и договором страхования, и не заменяет обычную ответственность Туроператора по каждому спору.

  ## 18. Срок действия и версии

  18.1. Договор действует с момента его заключения до исполнения сторонами обязательств. Для конкретного заказа применяется версия Оферты, сохраненная системой на момент оплаты.

  18.2. Новая редакция Оферты применяется к новым заказам с даты ее публикации и не изменяет уже заключенные договоры без предусмотренного законом или соглашением сторон основания.


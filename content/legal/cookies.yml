title: Политика использования cookies
slug: cookies
updatedAt: "2026-10-04"
content: |-
  Публичный сайт https://mikluha-maklai.ru не использует cookies, системы аналитики, рекламные технологии или tracking SDK.

  При переходе к оформлению заказа отдельный сервис https://book.mikluha-maklai.ru устанавливает только необходимую защищенную cookie вида `__Host-mk_<номер заказа>`. Она связывает браузер с начатым заказом и не позволяет другому браузеру просматривать или оплачивать его.

  Cookie содержит случайный секрет состояния, а не ФИО, телефон, email, паспортные данные или платежные реквизиты. Она передается только по HTTPS, недоступна JavaScript и не отправляется на другие домены (`Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/`). Максимальный срок — 7 дней.

  Без этой cookie нельзя безопасно продолжить уже начатое онлайн-бронирование. Необязательных cookies и баннера выбора категорий нет.

  Вопросы о cookies и персональных данных: artur@mikluha-maklai.ru.

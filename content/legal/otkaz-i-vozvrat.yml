title: Правила отказа и возврата
slug: otkaz-i-vozvrat
updatedAt: "2026-10-20"
content: |-
  Настоящие правила применяются вместе с Публичной офертой и Заявкой на бронирование и не ограничивают права потребителя по закону.

  ## Добровольный отказ

  Заказчик вправе отказаться от договора в любое время. Туроператор может учесть только документально подтверждённые фактически понесённые расходы, непосредственно связанные с исполнением данного заказа.

  ## Ориентиры добровольного внесудебного урегулирования

  При отсутствии документально подтверждённых фактически понесённых расходов, непосредственно связанных с данным заказом, удержание какой-либо суммы не допускается. Законный размер возврата устанавливается индивидуально на основании таких расходов; шкала ниже не заменяет расчёт и не устанавливает фиксированную неустойку.

  Для ускоренного внесудебного урегулирования добровольного отказа Туроператор предлагает ориентировочную шкалу в зависимости от времени получения уведомления до указанного в Заявке момента отправления (точное время, без округления до календарного дня):

  - 14 суток (336 часов) и более — предложение о добровольном возврате 95% стоимости отменяемой части заказа;
  - менее 14, но не менее 10 суток (240 часов) — предложение о добровольном возврате 90%;
  - менее 10, но не менее 3 суток (72 часа) — предложение о добровольном возврате 50%;
  - менее 3 суток, но более 2 суток (48 часов) — предложение о добровольном возврате 30%;
  - 2 суток (48 часов) и менее — возможный добровольный возврат 0%, исключительно если допустимые документально подтверждённые фактически понесённые расходы достигают стоимости отменяемой части заказа.

  Эта шкала является предложением процедуры добровольного урегулирования, а не фиксированной неустойкой, доказательством расходов или отказом Заказчика от права на возврат. Фактическая сумма, подлежащая возврату по закону, определяется отдельно по подтверждённым расходам, непосредственно относящимся к конкретному заказу. Если она превышает сумму из шкалы, Туроператор возвращает большую сумму без требования обращения Заказчика в суд. Если подтверждённые допустимые расходы ниже предполагаемого по шкале удержания, возвращается большая сумма. Если они выше, законная сумма возврата определяется исключительно на основании индивидуального документального расчёта, а не автоматически по проценту. Упущенная выгода от непроданного места не считается фактически понесёнными расходами при законном отказе. Специальные предусмотренные законом основания возврата имеют приоритет.

  Предложение по шкале не отменяет права на индивидуальный расчёт и возврат в предусмотренном законом размере. Заказчик может заявить требования непосредственно Туроператору, не обращаясь в суд; внесудебный порядок не является обязательным препятствием для судебной защиты.

  ## Подтверждение расходов и индивидуальное урегулирование

  При отказе одного туриста из группового заказа расчёт выполняется применительно к его части обязательства. Распределённая доля фрахта автобуса или блока гостиничных номеров учитывается лишь при подтверждении относимости, фактического несения и невозможности возмещения соответствующего расхода. При расчёте расходов на перевозку по договору фрахтования, блоки мест размещения и экскурсионное обслуживание Туроператор учитывает лишь документально подтверждённые затраты и обязательства, непосредственно относящиеся к отменяемой части заказа, возникшие до получения отказа и не подлежащие возврату или обоснованному уменьшению. Подтверждением служат договоры с поставщиками, конкретные бронирования и даты, счета, платежи, документы об оказанных услугах, основания невозвратности и сведения о возвратах. Одного внутреннего расчёта или условия договора о штрафе поставщика недостаточно для признания суммы расходом потребителя; юридическая квалификация уже уплаченных сумм, возникших обязательств и санкций поставщиков определяется отдельно с учётом закона и фактических обстоятельств. Реальные возвраты от поставщиков и повторная продажа освобождённой услуги учитываются во избежание двойного возмещения.

  Отдельное письменное соглашение после отказа возможно только добровольно, после раскрытия расчёта и без отказа от обязательных прав. Возврат суммы, причитающейся по закону, не обусловлен подписанием соглашения или обращением в суд.

  По согласованию с Туроператором допускаются перенос поездки и замена туриста с переоформлением документов и подтверждением связанных расходов.

  ## Как отказаться

  Направьте заявление на refunds@mikluha-maklai.ru или по адресу: 650065, г. Кемерово, проспект Московский, д. 31, кв. 145. Укажите номер заказа, ФИО Заказчика, туристов, которых касается отказ, и контакт для ответа. Не отправляйте сканы паспортов, полные реквизиты карты или банковские коды. Туроператор фиксирует дату и время получения заявления, подтверждает получение и стремится сообщить расчёт и дальнейшие действия не позднее пяти рабочих дней, не продлевая установленный законом срок возврата.

  ## Особые основания

  При официально подтвержденной угрозе безопасности жизни или здоровью туристов либо опасности причинения вреда их имуществу в месте пребывания применяются специальные последствия, установленные законом, включая возврат общей цены при расторжении до начала путешествия.

  При невозможности поездки из-за болезни туриста, подтверждённой медицинскими документами, договор может быть изменён или расторгнут в связи с существенным изменением обстоятельств; последствия определяются законом и индивидуальным расчётом, без автоматического штрафа по шкале.

  Если Туроператор не может исполнить тур на согласованных существенных условиях, изменение возможно с согласия Заказчика; иначе производится возврат в объеме, установленном законом.

  ## Способ возврата

  Возврат производится через ту же квалифицированную платежную цепочку и, как правило, на тот же платежный инструмент, которым был оплачен заказ. Срок определяется законом и основанием возврата. По требованиям, к которым применим десятидневный срок, Туроператор выполняет расчёт и инициирует возврат в течение 10 календарных дней от получения требования, не ожидая подписания отдельного соглашения. Срок зачисления банком зависит от платёжной системы.

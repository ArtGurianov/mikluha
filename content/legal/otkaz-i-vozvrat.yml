title: Правила отказа и возврата
slug: otkaz-i-vozvrat
updatedAt: "2026-10-20"
content: |-
  Настоящие правила применяются вместе с Публичной офертой и Заявкой на бронирование и не ограничивают права потребителя по закону.

  ## Добровольный отказ

  Заказчик вправе отказаться от договора в любое время. Туроператор может учесть только документально подтверждённые фактически понесённые расходы, непосредственно связанные с исполнением данного заказа.

  ## Ориентиры добровольного внесудебного урегулирования

  Для ускоренного внесудебного урегулирования добровольного отказа Туроператор предлагает ориентировочную шкалу в зависимости от времени получения уведомления до указанного в Заявке момента отправления (точное время, без округления до календарного дня):

  - 14 суток (336 часов) и более: предложение о возврате 95% стоимости заказа (ориентир удержания 5%);
  - менее 14, но не менее 10 суток (240 часов): возврат 90% (ориентир удержания 10%);
  - менее 10, но не менее 3 суток (72 часа): возврат 50% (ориентир удержания 50%);
  - менее 3 суток, но более 2 суток (48 часов): возврат 30% (ориентир удержания 70%);
  - 2 суток (48 часов) и менее: возможный возврат 0% (ориентир удержания 100%) лишь если допустимые документально подтверждённые фактически понесённые расходы достигают уплаченной суммы.

  Эта шкала является предложением процедуры добровольного урегулирования, а не фиксированной неустойкой, доказательством расходов или отказом Заказчика от права на возврат. Фактическая сумма, подлежащая возврату по закону, определяется отдельно по подтверждённым расходам, непосредственно относящимся к конкретному заказу. Если она превышает сумму из шкалы, Туроператор возвращает большую сумму без требования обращения Заказчика в суд. В частности, удержание 5% при раннем отказе не производится при отсутствии подтверждённых допустимых расходов. Если допускаемые законом расходы выше ориентировочного удержания, уменьшение предложенной выплаты возможно лишь на предусмотренных законом основаниях и с документальным расчётом, а не автоматически. Упущенная выгода от непроданного места не считается фактически понесёнными расходами при законном отказе. Специальные предусмотренные законом основания возврата имеют приоритет.

  Предложение по шкале не отменяет права на индивидуальный расчёт и возврат в предусмотренном законом размере. Заказчик может заявить требования непосредственно Туроператору, не обращаясь в суд; внесудебный порядок не является обязательным препятствием для судебной защиты.

  ## Как отказаться

  Направьте заявление на refunds@mikluha-maklai.ru или по адресу: 650065, г. Кемерово, проспект Московский, д. 31, кв. 145. Укажите номер заказа, ФИО Заказчика, туристов, которых касается отказ, и контакт для ответа. Не отправляйте сканы паспортов, полные реквизиты карты или банковские коды. Туроператор фиксирует дату и время получения заявления и сообщает расчёт и дальнейшие действия.

  ## Особые основания

  При официально подтвержденной угрозе безопасности жизни или здоровью туристов либо опасности причинения вреда их имуществу в месте пребывания применяются специальные последствия, установленные законом, включая возврат общей цены при расторжении до начала путешествия.

  Если Туроператор не может исполнить тур на согласованных существенных условиях, изменение возможно с согласия Заказчика; иначе производится возврат в объеме, установленном законом.

  ## Способ возврата

  Возврат производится через ту же квалифицированную платежную цепочку и, как правило, на тот же платежный инструмент, которым был оплачен заказ. Срок определяется законом и основанием возврата.

title: Правила отказа и возврата
slug: otkaz-i-vozvrat
updatedAt: "2026-10-04"
content: |-
  Настоящие правила применяются вместе с Публичной офертой и Заявкой на бронирование и не ограничивают права потребителя по закону.

  ## Добровольный отказ

  Заказчик вправе отказаться от договора до его полного исполнения. Для заказов, оформленных по действующей онлайн-схеме запуска, при одобренном возврате Туроператор возвращает **всю фактически уплаченную сумму**. Фактически понесенные расходы из возврата не вычитаются.

  Это правило действует, пока платежная и учетная схема Туроператора квалифицирована только для полного возврата через АО «Альфа-Банк» и Refref. Частичный возврат или штатный ручной возврат части суммы через кабинет банка не применяется.

  ## Как отказаться

  Направьте заявление на artur@mikluha-maklai.ru. Укажите номер заказа, ФИО Заказчика, каких туристов касается отказ, и контактные данные. Туроператор фиксирует дату получения заявления и сообщает решение и дальнейшие действия.

  ## Особые основания

  При официально подтвержденной угрозе безопасности жизни или здоровью туристов либо опасности причинения вреда их имуществу в месте пребывания применяются специальные последствия, установленные законом, включая возврат общей цены при расторжении до начала путешествия.

  Если Туроператор не может исполнить тур на согласованных существенных условиях, изменение возможно с согласия Заказчика; иначе производится возврат в объеме, установленном законом.

  ## Способ возврата

  Возврат производится через ту же квалифицированную платежную цепочку и, как правило, на тот же платежный инструмент, которым был оплачен заказ. Срок определяется законом и основанием возврата.

title: Правила оплаты
slug: pravila-oplaty
updatedAt: "2026-10-04"
content: |-
  1. Стоимость конкретного туристского продукта указывается в рублях в Заявке на бронирование до перехода к оплате.

  2. Для онлайн-бронирования применяется 100% предварительная оплата полной стоимости заказа. Частичная предоплата и старый перевод по QR-коду не используются.

  3. Оплата производится банковской картой или через СБП на защищенной странице АО «Альфа-Банк». Туроператор не получает полный номер карты, CVC/CVV или банковские коды подтверждения.

  4. Электронный договор о реализации туристского продукта считается заключенным с момента успешной оплаты, подтверждающей согласие Заказчика с Публичной офертой и показанной ему Заявкой на бронирование.

  5. После успешной оплаты Заказчик получает подтверждение заказа и доступ к сохраненным договорным документам. Кассовый чек направляется на указанный при бронировании адрес электронной почты через инфраструктуру банка и оператора фискальных данных.

  6. Если результат оплаты неясен, не создавайте повторный платеж. Проверьте статус заказа по сохраненной ссылке или свяжитесь с Туроператором: +7 (903) 907-55-47, artur@mikluha-maklai.ru.

  7. Возвраты осуществляются по Публичной оферте, Правилам отказа и возврата и законодательству Российской Федерации.

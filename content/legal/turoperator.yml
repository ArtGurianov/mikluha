  ## Как обратиться за страховым возмещением

  При наличии предусмотренных законом оснований турист, его законный представитель и (или) иной заказчик вправе обратиться с письменным требованием о страховом возмещении непосредственно к страховщику в пределах размера финансового обеспечения. Требование составляется и подтверждается документами в соответствии со статьей 17.5 Федерального закона № 132-ФЗ.

  - В требовании указываются сведения о туристе или заказчике, договоре страхования, договоре о реализации туристского продукта, обстоятельствах неисполнения и размере реального ущерба.
  - К требованию прилагаются предусмотренные законом документы, включая документ, удостоверяющий личность, договор о реализации туристского продукта и документы, подтверждающие реальный ущерб.
  - Требование может быть предъявлено в течение срока исковой давности по основанию, возникшему в период действия финансового обеспечения.

  ## Обращения к Туроператору

  Обращения можно направлять по адресу Туроператора или на электронную почту artur@mikluha-maklai.ru. Книга отзывов и предложений предоставляется по требованию потребителя.

title: Условия бронирования
slug: booking-terms
updatedAt: "2026-08-01"
content: |-
  ## Как устроено бронирование

  Сайт «Миклуха Маклай» не является автоматизированной системой бронирования и не обрабатывает
  персональные данные посетителей. Нажимая «Забронировать место», вы открываете информационное
  окно с суммой предоплаты и QR-кодом для перевода — никакие данные при этом никуда не
  отправляются.

  После того как вы самостоятельно выполните перевод по QR-коду, необходимо сообщить об этом
  организатору по указанному телефону. Место в группе считается забронированным только после
  подтверждения организатором вручную.

  ## Что важно знать

  - Сайт не хранит сведения о том, кто и сколько перевёл по QR-коду.
  - Точные условия отмены, переноса даты и возврата предоплаты уточняйте у организатора по
    телефону — они могут зависеть от конкретного выезда.
  - Полная стоимость поездки может отличаться от суммы предоплаты — остаток обсуждается с
    организатором напрямую.

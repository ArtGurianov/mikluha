title: Условия бронирования
slug: booking-terms
updatedAt: "2026-08-20"
content: |-
  ## Как устроено бронирование

  Сайт «Миклуха Маклай» не является автоматизированной системой бронирования и не обрабатывает
  персональные данные посетителей. Нажимая «Уточнить поездку», вы открываете информационное
  окно с телефоном организатора. Для выезда с открытым бронированием в этом же окне могут быть
  указаны сумма и QR-код для перевода — никакие данные при этом никуда не отправляются.

  После того как вы самостоятельно выполните перевод по QR-коду, необходимо сообщить об этом
  организатору по указанному телефону. Место в группе считается забронированным только после
  подтверждения организатором вручную.

  ## Что важно знать

  - Сайт не хранит сведения о том, кто и сколько перевёл по QR-коду.
  - Точные условия отмены, переноса даты и возврата бронирования уточняйте у организатора по
    телефону — они могут зависеть от конкретного выезда.
  - Полная стоимость поездки может отличаться от суммы бронирования — остаток обсуждается с
    организатором напрямую.

title: Красноярские Столбы
slug: krasnoyarsk-stolby
shortDescription: >-
  Скальные останцы, тайга и виды на Енисей в пешей доступности от города — короткий, но насыщенный
  выезд выходного дня.
description: >-
  «Столбы» — заповедник в тайге под Красноярском со скальными столбами причудливых форм. Формат
  короче алтайского: идеально, если хочется быстро выбраться из города без долгого отпуска.


  Ночуем в оборудованном лагере, днём — треккинг по тропам заповедника и свободное лазание по
  нижним скалам для желающих.

title: Красноярск
slug: krasnoyarsk
shortDescription: >-
  Трёхдневный автобусный тур из Кемерово: обзорная экскурсия по Красноярску и Дивногорску,
  целый день на Столбах и посещение парка «Роев ручей».
description: |-
  Насыщенный трёхдневный тур из Кемерово с проживанием в гостевом доме «Шумиха» на Красноярском
  море. Участники размещаются в двухэтажных коттеджах по десять человек, в двух-, трёх- и
  четырёхместных номерах.

  Программа сочетает большую обзорную экскурсию, пеший день на Красноярских Столбах и посещение
  парка флоры и фауны «Роев ручей». Отдельные остановки и продолжительность частей маршрута могут
  корректироваться организатором по фактическому таймингу.

  ## День 1 — Красноярск и Дивногорск

  - 00:30 — отправление от Летнего вокзала Кемерово.
  - Около 09:30 — прибытие в гостевой дом «Шумиха», размещение и завтрак.
  - 10:30–19:00 — обзорная экскурсия по Красноярску и Дивногорску продолжительностью 8–9 часов.

  В Красноярске маршрут начинается на Стрелке — месте слияния Енисея и Качи и основания
  Красноярского острога. В программе — набережная и велопешеходный мост к острову Татышев,
  памятники сусликам, площадь и мемориал Победы, смотровая площадка на Караульной горе с часовней,
  знакомой по десятирублёвой купюре, исторические улицы и купеческие дома.

  Далее группа знакомится с экологическим парком и одной из высоких городских смотровых площадок,
  посещает Свято-Успенский мужской монастырь на берегу Енисея, территорию Красивого берега и
  Восточный вход Красноярских Столбов с прогулкой до гранитного карьера.

  Обед проходит по маршруту и оплачивается отдельно; ориентир из предварительной программы —
  300–600 рублей в зависимости от заказа.

  После обеда — смотровая площадка «Царь-рыба», село Овсянка, связанное с Виктором Астафьевым,
  музей, набережная Дивногорска и Красноярская ГЭС. В 20:00 — ужин в гостевом доме, затем
  дискотека «Назад в СССР» и шашлык.

  ## День 2 — Красноярские Столбы

  Завтрак — в 09:00, начало экскурсии — в 10:00. Группа отправляется на весь день в центральную
  или восточную часть Столбов. Центральный маршрут даёт самые выразительные виды, но требует
  большей выносливости: ориентир — около 12 км пешком за день. В программе также предусмотрены
  подъём по лестнице и прогулка по Торгашинскому хребту; менее утомительный вариант маршрута
  организатор согласует с группой.

  Около 15:00 — сухой паёк от организаторов: бутерброды, варёные яйца и сосиски. После обеда
  прогулка продолжается. В 20:00 — ужин в гостевом доме, в 21:00 — дискотека.

  ## День 3 — «Роев ручей» и возвращение

  - 08:30 — завтрак и сбор вещей.
  - 09:30 — выезд из гостевого дома.
  - 10:00–14:00 — посещение парка флоры и фауны «Роев ручей».
  - 14:00 — отправление в Кемерово.
  - Около 22:00 — прибытие в Кемерово.

  ## Что важно учесть

  Второй день требует продолжительной ходьбы и подъёмов. Конкретный вариант маршрута на Столбах
  выбирается с учётом подготовки группы. Актуальную стоимость тура, перечень включённых услуг и
  условия оплаты уточняйте у организатора.

title: Телецкое озеро и активный Алтай
slug: altai
shortDescription: >-
  Четырёхдневный автобусный тур из Кемерово: Телецкое озеро, Чемальский тракт, Тавдинские пещеры,
  рафтинг или подъём на Чёртов Палец и вечера в компании.
description: |-
  Четырёхдневное путешествие из Кемерово с проживанием в гостевом доме в селе Ая. В программе —
  природные и культурные места Горного Алтая, поездка на Телецкое озеро, активный отдых на Катуни
  и Чемальском тракте, квизы, музыка и вечерние программы.

  Размещение — в двух-, трёх- и четырёхместных номерах со всеми удобствами. Программа
  предварительная: точные остановки и время организатор подтверждает перед выездом.

  ## День 1 — Сростки, Тавдинские пещеры и Катунь

  - 00:30 — отправление от Летнего вокзала Кемерово.
  - 08:00 — Сростки, родина Василия Шукшина: памятник-мемориал писателю и актёру.
  - 09:00 — завтрак в кафе со знаменитыми сростинскими пирогами за свой счёт.
  - 10:30 — заселение в гостевой дом в селе Ая.
  - 12:00 — экскурсия в Тавдинские пещеры. В августовской программе после пещер также запланирована
    «Хоббитания» — шоколадная деревня.
  - 15:00 — активность на выбор: несложный сплав по манжерокским порогам Катуни продолжительностью
    2–2,5 часа или подъём на Чёртов Палец с рассказами о местных легендах.
  - 18:00 — смотровая площадка парка Рериха и грот Ихтиандра.
  - 19:00 — возвращение в гостевой дом, 20:00 — ужин, 20:30 — квиз «Кто хочет стать
    миллионером».
  - 21:30–23:55 — дискотека «Назад в СССР», после полуночи — песни под гитару и шашлык.

  ## День 2 — Телецкое озеро или Манжерок

  Завтрак — в 08:00, выезд из гостевого дома — в 09:00. Основная часть дня — пятичасовая прогулка
  на теплоходе «Пионер Алтая» с 15:00 до 20:00, с высадками у водопадов Чедор и Корбу и посещением мыса Айран.
  Первую часть маршрута сопровождает аудиоэкскурсия голосом Николая Дроздова, вторую — гид на
  теплоходе. Около 22:00 по дороге обратно запланирован ужин; ориентировочное возвращение в Аю —
  в 23:30.

  Для выезда 28–31 августа вместо Телецкого озера можно выбрать день активного отдыха в
  Манжероке с 10:00 до 20:00: родельбан, сапбординг, вейк-парк и подъём по канатной дороге.
  Условия участия и оплаты этих активностей уточняются у организатора.

  ## День 3 — Чемальский тракт

  Завтрак — в 08:00, выезд — в 09:00. Маршрут включает гору Менжелик, остров Патмос, Зубы Дракона
  и урочище Че-Чкыш с водопадами. В июльской программе запланирован Сад пионов, в августовской —
  Камышлинский водопад. Около 17:00 группа приезжает к источнику Аржан-Суу, около 18:00 — на
  пасеку № 13 в селе Ая.

  По желанию можно прокатиться на моторных лодках — эта активность оплачивается отдельно. На
  пасеке можно продегустировать медовуху и приобрести мёд, травы и местные продукты. Вечером —
  брейн-ринг, настольный теннис, бильярд и гала-дискотека с праздничным ужином; возможность
  посещения бани уточняется для конкретного выезда.

  ## День 4 — возвращение в Кемерово

  - 09:00 — завтрак.
  - 10:00 — отправление из села Ая, по пути часовая остановка на сувенирном рынке.
  - Около 21:00 — прибытие к Летнему вокзалу Кемерово.

  ## Что важно учесть

  Тур сочетает длительные автобусные переезды, прогулки и активности разной нагрузки. Рафтинг,
  подъём на Чёртов Палец, водные развлечения в Манжероке и поездка на моторной лодке выбираются
  участниками по желанию. Актуальную стоимость тура, перечень включённых услуг и доплаты уточняйте
  у организатора перед бронированием.

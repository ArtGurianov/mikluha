title: Горный Алтай
slug: altai
shortDescription: >-
  Пешие маршруты среди снежных вершин, альпийских лугов и бирюзовых рек — небольшой группой, с
  ночёвками в палатках у костра.
description: >-
  Горный Алтай — один из самых атмосферных регионов России для пешего похода: ледники, кедровые
  леса, перевалы и деревни, где время идёт медленнее. Маршрут проходит без гонки за
  километражем — мы идём в комфортном темпе, чтобы у каждого было время осмотреться.


  Группа — до 10-12 человек. Ночуем в палатках, готовим на костре, вместе разбираем и собираем
  лагерь. Опыт похода не обязателен, важна только базовая физическая подготовка.

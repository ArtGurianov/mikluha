# Static-only production runtime for the Next.js `output: 'export'` build
#. No proxying, no logging of visitor requests.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No user-data logging policy: the public web container must
    # not persist request-level logs (IP/User-Agent/etc).
    access_log off;

    # nginx does not inherit add_header from a parent context into a location
    # block that defines its own add_header — so these three are repeated in
    # every location below that also sets Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # trailingSlash: true -> every route is a directory with its own index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Next.js build output — content-hashed filenames, safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Committed demo WebP files are versioned together with the static release.
    location /media/demo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

# Static-only production runtime for the Next.js `output: 'export'` build
# (PRD sections 35, 49.1). No proxying, no logging of visitor requests.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No user-data logging policy (PRD 49.1): the public web container must
    # not persist request-level logs (IP/User-Agent/etc).
    access_log off;

    # trailingSlash: true -> every route is a directory with its own index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Generated CMS assets are content-addressed and effectively immutable.
    location /generated/cms/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

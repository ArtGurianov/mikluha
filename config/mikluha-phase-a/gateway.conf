# Review template: render __SCOPE__ as acceptance|working; never copy a production certificate.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 12m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_buffering off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    server {
        listen 443 ssl default_server;
        server_name _;
        return 421;
    }
    server {
        listen 443 ssl;
        server_name admin.__SCOPE__.mikluha.test;
        if ($http_host != "admin.__SCOPE__.mikluha.test") { return 421; }
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location / {
            set $upstream http://admin:80;
            proxy_pass $upstream;
            proxy_set_header Host admin.__SCOPE__.mikluha.test;
            # Private ingress deliberately does not trust arbitrary forwarded client IPs.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
        }
    }
    server {
        listen 443 ssl;
        server_name site.__SCOPE__.mikluha.test;
        if ($http_host != "site.__SCOPE__.mikluha.test") { return 421; }
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location / {
            set $upstream http://site:3000;
            proxy_pass $upstream;
            proxy_set_header Host site.__SCOPE__.mikluha.test;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
        }
    }
}

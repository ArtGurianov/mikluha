name: CI

# Independent check of every pull request before merge: the commands a
# contributor runs locally, then the whole release pipeline in staging mode
# (production mode is blocked by the launchReady gate while content is demo
# data). Pull requests only — CMS Saves push straight to main and must not
# each start a run; Coolify runs build:production again for every release.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      # No version here: it comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as the Dockerfile's node:22-alpine build stage.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # PageProps/LayoutProps are generated route types: a fresh checkout has
      # none until `next typegen` (or a build) writes them.
      - name: Typecheck
        run: pnpm exec next typegen && pnpm exec tsc --noEmit

      - name: Release pipeline (staging)
        env:
          DEPLOY_ENV: staging
          SITE_URL: https://staging.invalid
          SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm run build:production

  # mikluha-commerce (commerce/README.md): its own package, tests against a real Postgres, and the
  # image built from the repository root, as Coolify builds it.
  commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: commerce
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Immutable migration history (including intermediate commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec tsx scripts/check-migration-history.ts "$BASE_SHA" "$HEAD_SHA"

      - run: pnpm run typecheck

      # test/editorial-contract.test.ts restores a pg_dump of the migrated schema with psql.
      - run: pg_dump --version && psql --version

      - run: pnpm test

      # Integration build uses the default test-merge checkout and its actual SHA.
      - name: Merge-tree image
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: docker build -f commerce/Dockerfile --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -t mikluha-commerce:merge-ci .

  # Qualification is a different proof: the immutable runtime at the PR's exact HEAD,
  # even when main advanced and the integration merge-tree contains different content/code.
  commerce-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: commerce
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify exact HEAD checkout and clean tracked source
        run: node scripts/check-image-source.mjs "$EXPECTED_HEAD_SHA"

      - name: Exact-HEAD image
        working-directory: .
        run: docker build -f commerce/Dockerfile --build-arg SOURCE_COMMIT="$EXPECTED_HEAD_SHA" -t mikluha-commerce:head-ci .

      - name: Unchanged exact-HEAD image on compatible forward schema
        run: pnpm exec tsx scripts/qualify-schema-image.ts mikluha-commerce:head-ci "$EXPECTED_HEAD_SHA"

  # The static Control Room (control-room/README.md, ART-363): its own package; `build` ends with the
  # no-secret check over the exported files, and the image is built as Coolify would.
  control-room:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-room
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: control-room/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - name: Image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -t mikluha-control-room:ci .

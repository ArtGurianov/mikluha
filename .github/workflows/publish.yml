name: Publish site

# Fired by Sveltia CMS's global "Опубликовать изменения" toolbar button when
# no Deploy Hook URL is configured in the editor's browser (see RUNBOOK.md ->
# "CMS: публикация"). Sveltia's own editor PAT (Contents: Read and write) is
# already sufficient to create this event — no extra GitHub permission is
# needed. This workflow only relays the trigger to Coolify; it does not build
# anything itself.
on:
  repository_dispatch:
    types:
      - sveltia-cms-publish

concurrency:
  group: mikluha-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${COOLIFY_BASE_URL:?COOLIFY_BASE_URL secret is required}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN secret is required}"

          coolify_base_url="${COOLIFY_BASE_URL%/}"
          if [[ ! "$coolify_base_url" =~ ^https?://[^/]+$ ]]; then
            echo "::error::COOLIFY_BASE_URL must be only the Coolify HTTP(S) origin, without a path"
            exit 1
          fi
          echo "Coolify base: $coolify_base_url"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              "$coolify_base_url/api/v1/deploy?uuid=pxetekoyzceundmfpuapik4q&force=false" \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header "Accept: application/json"
          )"

          echo "Coolify HTTP status: $status"
          echo "Coolify response:"
          cat "$response_file"
          echo

          if [[ "$status" != "200" ]]; then
            echo "::error::Coolify deploy request returned HTTP $status"
            exit 1
          fi

          if ! jq -e '
            .deployments
            | type == "array"
            and length > 0
            and .[0].deployment_uuid != null
            and .[0].deployment_uuid != ""
          ' "$response_file" >/dev/null; then
            echo "::error::Coolify returned 200 but did not queue a deployment"
            exit 1
          fi

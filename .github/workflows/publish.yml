name: Publish site

# Two ways in, one Coolify deploy out. This workflow only relays the trigger
# to Coolify; it does not build anything itself.
#
# - repository_dispatch: Sveltia CMS's global "Опубликовать изменения" toolbar
#   button when no Deploy Hook URL is configured in the editor's browser (see
#   RUNBOOK.md -> "CMS: публикация"). Sveltia's own editor PAT (Contents: Read
#   and write) is already sufficient to create this event — no extra GitHub
#   permission is needed.
# - schedule: the static pages decide which departures are still upcoming at
#   build time, so the release is rebuilt shortly after midnight (site time)
#   on the days a departure has just started — otherwise the trip that left
#   stays on the site as "Набор открыт" with a booking button until the next
#   manual publish. Every other day the gate step below skips the deploy. See
#   docs/DECISIONS.md #7.
on:
  repository_dispatch:
    types:
      - sveltia-cms-publish
  schedule:
    # 17:23 UTC = 00:23 in Asia/Krasnoyarsk (UTC+7, no DST) — the
    # siteSettings.timezone. Off the top of the hour, where GitHub delays
    # scheduled runs the most. Move it if the site timezone ever changes.
    - cron: "23 17 * * *"

permissions:
  contents: read

concurrency:
  group: mikluha-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          sparse-checkout: content

      # Deploys only if a departure started yesterday or the day before (site
      # time): those are the only days the pages change without an edit. Two
      # days, so a scheduled run GitHub drops is caught up by the next one; the
      # redundant second deploy this causes otherwise is harmless.
      - name: Check whether a departure has just started
        id: gate
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail

          tz="$(grep -m1 '^timezone:' content/site-settings.yml | cut -d: -f2- | tr -d " \"'")"
          # `TZ=<unknown> date` silently falls back to UTC — refuse instead.
          if [[ -z "$tz" || ! -f "/usr/share/zoneinfo/$tz" ]]; then
            echo "::error::content/site-settings.yml timezone \"$tz\" is not a known IANA timezone"
            exit 1
          fi

          yesterday="$(TZ="$tz" date -d yesterday +%F)"
          day_before="$(TZ="$tz" date -d '2 days ago' +%F)"
          started="$(grep -h '^startDate:' content/departures/*.yml | cut -d: -f2- | tr -d " \"'" | sort -u)"

          if grep -qxF -e "$yesterday" -e "$day_before" <<<"$started"; then
            echo "A departure started on $day_before or $yesterday ($tz) — rebuilding so it drops off the site."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "No departure started on $day_before or $yesterday ($tz) — nothing on the site changed, skipping."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Coolify deployment
        if: github.event_name != 'schedule' || steps.gate.outputs.due == 'true'
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${COOLIFY_BASE_URL:?COOLIFY_BASE_URL secret is required}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN secret is required}"

          coolify_base_url="${COOLIFY_BASE_URL%/}"
          if [[ ! "$coolify_base_url" =~ ^https?://[^/]+$ ]]; then
            echo "::error::COOLIFY_BASE_URL must be only the Coolify HTTP(S) origin, without a path"
            exit 1
          fi
          echo "Coolify base: $coolify_base_url"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              "$coolify_base_url/api/v1/deploy?uuid=pxetekoyzceundmfpuapik4q&force=false" \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header "Accept: application/json"
          )"

          echo "Coolify HTTP status: $status"
          echo "Coolify response:"
          cat "$response_file"
          echo

          if [[ "$status" != "200" ]]; then
            echo "::error::Coolify deploy request returned HTTP $status"
            exit 1
          fi

          if ! jq -e '
            .deployments
            | type == "array"
            and length > 0
            and .[0].deployment_uuid != null
            and .[0].deployment_uuid != ""
          ' "$response_file" >/dev/null; then
            echo "::error::Coolify returned 200 but did not queue a deployment"
            exit 1
          fi
